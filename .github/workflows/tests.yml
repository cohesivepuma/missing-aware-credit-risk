name: Tests and reproducible experiments

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.13'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Run tests
        run: python -m pytest
      - name: Run baseline twice and compare reports
        run: |
          python experiments/run_baseline.py --output results/baseline-first.json
          python experiments/run_baseline.py --output results/baseline-second.json
          cmp results/baseline-first.json results/baseline-second.json
      - name: Run calibration twice and compare reports
        run: |
          python experiments/run_calibration.py --output results/calibration-first.json
          python experiments/run_calibration.py --output results/calibration-second.json
          cmp results/calibration-first.json results/calibration-second.json
